services:
  db:
    image: postgres:16-alpine
    container_name: mashala-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_wallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_wallet"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./bank-backend
    container_name: mashala-backend
    restart: unless-stopped
    environment:
      DB_NAME: ai_wallet
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: django-insecure-d!86t#2mm)w!l&eetnpxrf#!5)&)#%sm6h&=4-edgbkrcnivzz
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      JWT_SECRET_KEY: your-jwt-secret-key
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_LIFETIME: 60
      JWT_REFRESH_TOKEN_LIFETIME: 1440
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: mashala-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    container_name: mashala-ollama-init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: /bin/sh
    command:
      - "-c"
      - "until ollama list > /dev/null 2>&1; do sleep 1; done; echo 'Pulling nomic-embed-text:v1.5...'; ollama pull nomic-embed-text:v1.5; echo 'Ollama embedding model ready.'"
    restart: "no"

  retrieval:
    build:
      context: ./rag
    image: mashala-rag-builder:0.1.0
    container_name: mashala-retrieval
    restart: unless-stopped
    command:
      - "serve"
      - "--artifact-directory"
      - "/workspace/artifacts"
      - "--ollama-base-url"
      - "http://ollama:11434"
    volumes:
      - ./.mashala/rag:/workspace/artifacts:ro
    ports:
      - "8765:8765"
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
    container_name: mashala-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MASHALA_RAG_SERVICE_URL: http://retrieval:8765
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      NEXT_PUBLIC_AI_WALLET_BACKEND: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - retrieval

volumes:
  pgdata:
  ollama_data:
